<div class="login">
  <section class="hero">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-name">NÚCLEO</div>
    </div>
    <div class="hero-copy">
      <h1>Clientes, pedidos y materiales en un solo lugar.</h1>
      <p>Controla tu operación diaria con trazabilidad completa de cada acción.</p>
    </div>
    <div class="copyright">© 2026 Núcleo</div>
  </section>

  <section class="form-side">
    <form class="form" (ngSubmit)="submit()">
      <div>
        <h2>Iniciar sesión</h2>
        <p class="lead">Ingresa con tu usuario y contraseña</p>
      </div>

      <mat-form-field>
        <mat-label>Usuario</mat-label>
        <input matInput name="codVendedor" autocomplete="username" placeholder="370" maxlength="10"
          [(ngModel)]="codVendedor" (ngModelChange)="error.set('')" />
        <mat-icon matPrefix>badge</mat-icon>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input matInput name="password" autocomplete="current-password" placeholder="Ingrese Usuario" maxlength="4"
          [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" (ngModelChange)="error.set('')" />
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix type="button" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <div class="alert-danger" role="alert">{{ error() }}</div>
      }

      <button mat-flat-button class="btn-brand submit" type="submit">Ingresar</button>

    </form>
  </section>
</div>
